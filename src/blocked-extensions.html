<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Access Restricted</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card" style="max-width: 500px;">
      <h2 data-i18n="blockedExtensionsTitle" style="color: #ef4444;">Access Restricted 🔒</h2>
      <p data-i18n="blockedExtensionsDesc">
        For security and stability, access to browser extension settings and developer pages is restricted.
      </p>
      <div style="background: rgba(128, 128, 128, 0.05); padding: 15px; border-radius: 8px; font-size: 13px; text-align: left; margin-bottom: 20px;">
        <strong data-i18n="statusLabel">Reason:</strong>
        <span data-i18n="blockedExtensionsReason">Parental control settings do not permit loading extension management pages to prevent disabling the safety filters.</span>
      </div>
    </div>
    <script src="./blocked-extensions.js"></script>
  </body>
</html>

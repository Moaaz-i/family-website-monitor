<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="blockedTitle">Site Blocked</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="blocked-page">
    <main class="card blocked-card">
      <!-- Child-facing part: the message, the site, and nothing technical. -->
      <div class="blocked-hero" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="img" focusable="false">
          <path
            d="M24 4 8 10v12c0 10.5 6.9 18.9 16 22 9.1-3.1 16-11.5 16-22V10L24 4Z"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            d="M17 24h14M24 17v14"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <h2 data-i18n="blockedSorry">Sorry, this site is not currently allowed.</h2>

      <p class="blocked-site-line">
        <span data-i18n="blockedSite">Blocked Site:</span>
        <strong id="blockedUrl">...</strong>
      </p>

      <p id="reasonMessage" class="blocked-reason" data-i18n="blockedReasonDefault">
        Parental permission is required for access.
      </p>

      <!-- The parent's own line, when they wrote one: rendered as plain
           text with textContent, never as markup. -->
      <p id="parentNote" class="parent-note" hidden></p>

      <!-- Child-facing escape hatch: it can only *ask*. The worker raises a
           notification and the parent's own tap grants the time. -->
      <button
        id="askMoreTimeBtn"
        class="btn btn-secondary ask-more-time"
        data-i18n="askMoreTimeButton"
      >
        Ask a parent for 15 more minutes
      </button>
      <p id="askStatus" class="ask-status" role="status" aria-live="polite"></p>

      <!-- Parent-only part: visually secondary so the page reads as a rule,
           not as a login form the child is invited to fill in. -->
      <section class="parent-area" aria-labelledby="parentAreaTitle">
        <h3 id="parentAreaTitle" data-i18n="parentAreaTitle">Parents</h3>
        <p class="parent-area-hint" data-i18n="parentAreaHint">
          Enter the parent password to change this rule.
        </p>

        <div class="parent-unlock" id="unlockRow">
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            data-i18n-placeholder="enterParentPassword"
          />
          <button id="unlockBtn" class="btn btn-primary" data-i18n="verify">
            Verify
          </button>
        </div>

        <div id="optionsSection" class="parent-options" style="display: none">
          <h3 data-i18n="chooseAction">Choose an action:</h3>
          <select id="actionType">
            <option value="always" data-i18n="allowAlways">
              Add permanently to whitelist
            </option>
            <option value="temp" data-i18n="allowTemp">
              Allow for a specific time (minutes)
            </option>
          </select>
          <input
            type="number"
            id="duration"
            min="1"
            data-i18n-placeholder="minutesTempPlaceholder"
            style="display: none"
          />
          <label class="whole-domain-toggle parent-domain-toggle">
            <input type="checkbox" id="blockedDomainWhitelist" />
            <span class="switch-slider"></span>
            <span data-i18n="allowWholeDomain"></span>
          </label>
          <button id="saveBtn" class="btn btn-success" data-i18n="saveAndApply">
            Save and Apply
          </button>
        </div>
      </section>
    </main>
    <script src="./blocked.js"></script>
  </body>
</html>

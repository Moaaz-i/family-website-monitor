<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="appName">Family Website Monitor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <!--
    The extension overrides the new tab page (chrome_url_overrides). This is
    a child-facing page: it shows the clock, what is left of today's screen
    time and the sites this family allows. It never shows the rule lists and
    has no way to change them — the parent panel stays behind the password.
  -->
  <body class="newtab-body">
    <main class="newtab-shell">
      <header class="newtab-header">
        <span class="newtab-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <path
              d="M24 4 8 10v12c0 10.5 6.9 18.9 16 22 9.1-3.1 16-11.5 16-22V10L24 4Z"
              fill="none"
              stroke="currentColor"
              stroke-width="3.5"
              stroke-linejoin="round"
            />
            <path
              d="M17 24h14M24 17v14"
              stroke="currentColor"
              stroke-width="3.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <div>
          <h1 data-i18n="appName" style="margin: 0">Family Website Monitor</h1>
          <p class="newtab-date" id="newtabDate"></p>
        </div>
      </header>

      <div class="newtab-clock" id="newtabClock">--:--</div>

      <p class="newtab-status" id="newtabStatus" role="status"></p>

      <!-- Search: Enter searches the web; typing offers the allowed sites
           first, so the safe answer is always the fastest one to reach. -->
      <div class="newtab-search-wrap">
        <form class="newtab-search" id="newtabSearch" role="search">
          <svg
            class="newtab-search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
            />
            <path
              d="m16 16 4.5 4.5"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
          <input
            id="newtabSearchInput"
            type="search"
            dir="auto"
            autocomplete="off"
            spellcheck="false"
            aria-controls="newtabSuggestions"
            data-i18n-placeholder="newtabSearchPlaceholder"
            placeholder="Search the web, or jump to an allowed site"
          />
          <kbd class="newtab-search-key" aria-hidden="true">↵</kbd>
          <button type="submit" class="newtab-search-go" data-i18n="newtabSearchGo">
            Search
          </button>
        </form>
        <ul
          id="newtabSuggestions"
          class="newtab-suggestions"
          role="listbox"
          aria-label="Allowed sites"
          hidden
        ></ul>
      </div>

      <section class="newtab-sites">
        <h2 data-i18n="newtabSitesTitle">Allowed sites</h2>
        <!-- Plain <a> elements: middle-click and Ctrl/Cmd-click work as usual -->
        <div id="newtabTiles" class="newtab-tiles"></div>
        <p id="newtabEmpty" class="newtab-empty" hidden data-i18n="newtabNoSites">
          No allowed sites yet. A parent can add them in the panel.
        </p>
        <p
          id="newtabNoMatch"
          class="newtab-empty"
          hidden
          data-i18n="newtabSearchNoMatch"
        >
          No allowed site matches your search.
        </p>
      </section>
    </main>

    <script type="module" src="newtab.js"></script>
  </body>
</html>

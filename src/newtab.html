<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="appName">Family Website Monitor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <!--
    The extension overrides the new tab page (chrome_url_overrides). This is
    a child-facing page: it shows the clock, what is left of today's screen
    time and the sites this family allows. It never shows the rule lists and
    has no way to change them — the parent panel stays behind the password.
  -->
  <body class="newtab-body">
    <main class="newtab-shell">
      <header class="newtab-header">
        <span class="newtab-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <path
              d="M24 4 8 10v12c0 10.5 6.9 18.9 16 22 9.1-3.1 16-11.5 16-22V10L24 4Z"
              fill="none"
              stroke="currentColor"
              stroke-width="3.5"
              stroke-linejoin="round"
            />
            <path
              d="M17 24h14M24 17v14"
              stroke="currentColor"
              stroke-width="3.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <div>
          <h1 data-i18n="appName" style="margin: 0">Family Website Monitor</h1>
          <p class="newtab-date" id="newtabDate"></p>
        </div>
      </header>

      <div class="newtab-clock" id="newtabClock">--:--</div>

      <p class="newtab-status" id="newtabStatus" role="status"></p>

      <section class="newtab-sites">
        <h2 data-i18n="newtabSitesTitle">Allowed sites</h2>
        <!-- Plain <a> elements: middle-click and Ctrl/Cmd-click work as usual -->
        <div id="newtabTiles" class="newtab-tiles"></div>
        <p id="newtabEmpty" class="newtab-empty" hidden data-i18n="newtabNoSites">
          No allowed sites yet. A parent can add them in the panel.
        </p>
      </section>
    </main>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
